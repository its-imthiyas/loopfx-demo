<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Candlestick Chart for {{ pair }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.plot.ly/plotly-2.16.1.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Candlestick Chart for {{ pair }}</h1>
        <div id="candlestick-chart"></div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var graph_json = {{ graph_json | tojson | safe }};
            var graph_data = JSON.parse(graph_json);
            Plotly.react('candlestick-chart', graph_data.data, graph_data.layout);
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
