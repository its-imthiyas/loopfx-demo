<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Currency Prices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.plot.ly/plotly-2.16.1.min.js"></script>
</head>
<body>
    <h1>Currency Prices</h1>
    <div class="dropdown">
        <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          Choose the Currency Pair
        </button>
        <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="/pair/EURUSD">EURUSD</a></li>
            <li><a class="dropdown-item" href="/pair/GBPUSD">GBPUSD</a></li>
            <li><a class="dropdown-item" href="/pair/EURGBP">EURGBP</a></li>
            <li><a class="dropdown-item" href="/pair/USDCAD">USDCAD</a></li>
            <li><a class="dropdown-item" href="/currency/USDZAR">USDZAR</a></li>
          </ul>
      </div>
    <div class="container mt-5">
        <h1 class="mb-4">Currency Prices Plot</h1>
        <button id="filterdata-btn" class="btn btn-primary fx-plot">Fetch Data</button>
        <div id="technical-chart"></div>
        <div id="plotly-chart"></div>
    </div>
    <script>
        var graph_json = {{ graph_json | tojson | safe }};
        if (graph_json) {
            var graph_data = JSON.parse(graph_json);
            Plotly.react('plotly-chart', graph_data.data, graph_data.layout);
        } else {
            document.getElementById('plotly-chart').innerText = 'No data available to display the chart.';
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
